id: com.gitlab.adnan338.Nixwriter
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nixwriter
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --system-talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # This enables building downloaded crates offline
  env:
    CARGO_HOME: /run/build/nixwriter/cargo

modules:
  - name: nixwriter
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/nixwriter -t /app/bin
      - install -Dm644 resources/${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 resources/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 resources/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
    sources:
      #For development purposes
      # - type: dir
      #   path: "."
      - type: git
        url: https://gitlab.com/9898287/nixwriter
        tag: 3.5.0
        commit: d76697136f4d686224cac5a7c148fe19421e4cf0
      - type: patch
        path: fix-appdata.patch
      - deptree.json
